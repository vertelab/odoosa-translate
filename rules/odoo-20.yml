# rules/odoo-20.yml — Versionsspecifikt för Odoo 20.0
# ======================================================================
# Alla aktuella regler ligger i core.yml (versions: [18, 19, 20]).
# Denna fil är för 20.0-specifika tillägg/överridningar:
#   · ny regel: lägg till med samma term-struktur som core.yml
#   · överrida kärnregel: samma `id` som i core.yml (hela termen ersätts)
#
# Odoo 20 bröt ut flera kärnmoduler (base_vat, base_iban, account_add_gln)
# och bytte attrs→invisible, tree→list. Sådant syns INTE här — det påverkar
# vilka moduler som finns, och det sköts av fetch (modullistan kommer från
# odoo/odoo-trädet), inte av regelverket.
# ======================================================================
schema_version: 1

terms: []
